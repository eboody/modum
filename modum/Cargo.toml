[package]
name = "modum"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Workspace lint tool for Rust naming and API-shape policy"
license = "MIT"
repository = "https://github.com/eboody/modum"
documentation = "https://docs.rs/modum"
readme = "../README.md"

[[bin]]
name = "modum"
path = "src/bin/modum.rs"

[dependencies]
modum-core = { version = "0.2.0", path = "../modum-core" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
