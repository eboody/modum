[package]
name = "modum"
version = "0.1.2"
edition = "2024"
description = "Attribute macro that rewrites named items into module::item paths"
license = "MIT"
repository = "https://github.com/eboody/modum"
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
trybuild = "1"
